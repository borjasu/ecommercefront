<header class="bg-header text-cream">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-6 px-6 py-4">
    <a routerLink="/catalogo" class="font-display text-2xl font-semibold tracking-wide text-gold">
      Atelier
    </a>

    <nav class="hidden items-center gap-8 font-sans text-sm uppercase tracking-wide md:flex">
      @for (categoria of categorias; track categoria) {
        <a href="#" class="text-cream/80 transition-colors hover:text-gold">{{ categoria }}</a>
      }
    </nav>

    <div class="flex items-center gap-6 font-sans text-sm uppercase tracking-wide">
      @if (usuarioActual(); as usuario) {
        @if (usuario.rol === 'vendedor') {
          <a routerLink="/vendedor/dashboard" class="text-cream/80 transition-colors hover:text-gold">
            Panel vendedor
          </a>
        }
        <span class="normal-case text-cream/80">Hola, {{ usuario.nombre }}</span>
        <button
          type="button"
          (click)="cerrarSesion()"
          class="text-cream/80 transition-colors hover:text-gold"
        >
          Cerrar sesión
        </button>
      } @else {
        <a routerLink="/login" class="text-cream/80 transition-colors hover:text-gold">
          Iniciar sesión
        </a>
      }

      <button type="button" class="relative text-cream/80 transition-colors hover:text-gold">
        Carrito
        <span class="badge absolute -right-3 -top-3">0</span>
      </button>
    </div>
  </div>
</header>
