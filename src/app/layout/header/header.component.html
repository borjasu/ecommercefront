<header class="bg-header text-cream">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-6 px-6 py-4">
    <a href="#" class="font-display text-2xl font-semibold tracking-wide text-gold">
      Atelier
    </a>

    <nav class="hidden items-center gap-8 font-sans text-sm uppercase tracking-wide md:flex">
      @for (categoria of categorias; track categoria) {
        <a href="#" class="text-cream/80 transition-colors hover:text-gold">{{ categoria }}</a>
      }
    </nav>

    <div class="flex items-center gap-4">
      <button type="button" class="font-sans text-sm uppercase tracking-wide text-cream/80 transition-colors hover:text-gold">
        Cuenta
      </button>
      <button type="button" class="relative font-sans text-sm uppercase tracking-wide text-cream/80 transition-colors hover:text-gold">
        Carrito
        <span class="badge absolute -right-3 -top-3">0</span>
      </button>
    </div>
  </div>
</header>
