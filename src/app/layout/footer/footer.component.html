<footer class="bg-brand-ink text-brand-bone">
  <div class="mx-auto grid max-w-7xl gap-8 px-6 py-12 md:grid-cols-3">
    <div>
      <div class="flex items-center gap-2">
        <img src="brand/logo-frank-jeans.png" alt="Frank Jeans" class="h-8 w-8 object-contain" />
        <p class="font-display text-xl tracking-[0.1em] text-brand-gold">FRANK JEANS</p>
      </div>
      <p class="mt-3 max-w-xs font-body text-sm text-brand-bone/70">
        Mezclilla premium y ropa de taller, forjada para durar.
      </p>
    </div>

    <div class="font-body text-sm">
      <p class="mb-3 uppercase tracking-wide text-brand-muted">Navegación</p>
      <ul class="space-y-2 text-brand-bone/80">
        <li><a routerLink="/" class="transition-colors hover:text-brand-gold">Inicio</a></li>
        <li><a routerLink="/catalogo" class="transition-colors hover:text-brand-gold">Catálogo</a></li>
        <li><a routerLink="/contacto" class="transition-colors hover:text-brand-gold">Contacto</a></li>
      </ul>
    </div>

    <div class="font-body text-sm">
      <p class="mb-3 uppercase tracking-wide text-brand-muted">Síguenos</p>
      <ul class="space-y-2 text-brand-bone/80">
        @for (red of redesSociales; track red) {
          <li><a href="#" class="transition-colors hover:text-brand-gold">{{ red }}</a></li>
        }
      </ul>
    </div>
  </div>

  <div class="stitch-divider mx-6"></div>
  <div class="px-6 py-4 text-center font-body text-xs text-brand-bone/60">
    © {{ anio }} Frank Jeans. Todos los derechos reservados.
  </div>
</footer>
