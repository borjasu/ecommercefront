<div class="mx-auto max-w-7xl px-6 py-12">
  <div class="mb-6">
    <app-breadcrumb [items]="breadcrumbItems()" />
  </div>

  <div class="mb-10 flex flex-col gap-2">
    <h1 class="font-display text-3xl font-semibold text-brand-ink">{{ tituloSeccion() }}</h1>
    <p class="font-body text-sm text-brand-muted">{{ productos().length }} artículos disponibles</p>
  </div>

  @if (productos().length > 0) {
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (producto of productos(); track producto.id) {
        <app-producto-card [producto]="producto" (agregarAlCarrito)="onAgregarAlCarrito($event)" />
      }
    </div>
  } @else {
    <p class="py-16 text-center font-body text-sm text-brand-muted">
      {{ mensajeVacio() }}
    </p>
  }
</div>
