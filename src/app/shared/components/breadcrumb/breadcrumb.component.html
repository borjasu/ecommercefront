<nav class="font-body text-sm text-brand-muted" aria-label="breadcrumb">
  @for (item of items(); track item.label; let ultimo = $last) {
    @if (item.url && !ultimo) {
      <a [routerLink]="item.url" class="transition-colors hover:text-brand-gold">{{ item.label }}</a>
    } @else {
      <span [class.text-brand-text]="ultimo">{{ item.label }}</span>
    }

    @if (!ultimo) {
      <span class="mx-2">/</span>
    }
  }
</nav>
