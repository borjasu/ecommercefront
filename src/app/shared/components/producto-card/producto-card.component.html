<article class="flex flex-col">
  <a
    [routerLink]="['/producto', producto().id]"
    class="relative block overflow-hidden rounded-sm bg-white"
  >
    @if (producto().etiqueta) {
      <span class="badge absolute left-3 top-3 z-10">{{ producto().etiqueta }}</span>
    }
    <img
      [src]="producto().imagenUrl"
      [alt]="producto().nombre"
      class="aspect-[4/5] w-full object-cover transition-transform duration-300 hover:scale-105"
    />
  </a>

  <div class="mt-4 flex flex-col gap-1">
    <a [routerLink]="['/producto', producto().id]" class="font-sans text-sm text-ink hover:text-gold">
      {{ producto().nombre }}
    </a>
    <p class="font-sans text-sm font-semibold text-gold">${{ producto().precio }}</p>
  </div>

  <div class="mt-3 flex flex-wrap gap-2">
    @for (talla of producto().tallasDisponibles; track talla) {
      <button
        type="button"
        [class]="tallaSeleccionada() === talla ? 'talla-btn-active' : 'talla-btn'"
        (click)="seleccionarTalla(talla)"
      >
        {{ talla }}
      </button>
    }
  </div>

  <div class="mt-4 flex items-center justify-between">
    <span class="font-sans text-xs uppercase tracking-wide text-muted">Cantidad</span>
    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="decrementarCantidad()"
        [disabled]="cantidadSeleccionada() === 1"
        aria-label="Disminuir cantidad"
        class="inline-flex h-8 w-8 cursor-pointer items-center justify-center rounded-sm border border-muted font-sans text-sm text-ink transition-colors duration-150 hover:border-gold disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:border-muted"
      >
        −
      </button>
      <span class="w-5 text-center font-sans text-sm text-ink" aria-live="polite">{{ cantidadSeleccionada() }}</span>
      <button
        type="button"
        (click)="incrementarCantidad()"
        aria-label="Aumentar cantidad"
        class="inline-flex h-8 w-8 cursor-pointer items-center justify-center rounded-sm border border-muted font-sans text-sm text-ink transition-colors duration-150 hover:border-gold"
      >
        +
      </button>
    </div>
  </div>

  <button
    type="button"
    class="btn-gold mt-2 w-full disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="!tallaSeleccionada()"
    (click)="onAgregar()"
  >
    {{ agregado() ? '¡Agregado!' : '+ AGREGAR AL CARRITO' }}
  </button>
</article>
